<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — Reveluxo</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #000000; color: #eae5da; font-family: 'Jost', sans-serif; font-weight: 300; }
    * { box-sizing: border-box; }
    a { color: #c9a44c; text-decoration: none; }
    a:hover { color: #e3c684; }
    input, textarea, select, button { font-family: inherit; color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #b08a3e; outline-offset: 2px; }
    ::placeholder { color: #9a9286; }
    img, input, textarea, select { max-width: 100%; }
    .hidden { display: none !important; }
    
    /* Layout Admin */
    .admin-body { min-height: 100vh; background: #f4f1eb; color: #1b1814; font-family: 'Manrope', system-ui, sans-serif; font-weight: 500; }
    .nav-tab-btn { flex: 0 0 auto; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #d9d1c4; font: 600 13px 'Manrope', sans-serif; cursor: pointer; }
    .nav-tab-btn.active { background: #f3ede3; color: #0c0b0a; }
    
    /* Toast */
    .toast-msg { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 95; background: #1b1814; color: #fff; padding: 14px 22px; border-radius: 999px; font: 600 13.5px 'Manrope', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: 90vw; text-align: center; }
    .toast-msg.error { background: #a2342a; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="view-login" class="hidden" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #f4f1eb; color: #1b1814; font-family: Manrope, system-ui, sans-serif;">
    <div style="flex: 1 1 380px; min-height: 240px; background: #000; display: grid; place-items: center; padding: 32px;">
      <img src="logo-reveluxo.png" alt="Reveluxo — Moda Feminina" style="width: min(80%, 520px);" onerror="this.src='https://via.placeholder.com/460x100?text=Reveluxo'" />
    </div>
    <form onsubmit="handleLogin(event)" style="flex: 1 1 380px; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 48px clamp(24px, 6vw, 96px); max-width: 560px;">
      <div style="font: 700 11px Manrope, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #8a6a2c;">Área da loja</div>
      <h1 style="margin: 0; font: 600 44px/1.05 'Cormorant Garamond', serif;">Entrar no painel</h1>
      <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c;">Usuário
        <input type="text" id="login-user" autocomplete="username" style="height: 48px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" required />
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c;">Senha
        <input type="password" id="login-pass" autocomplete="current-password" style="height: 48px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" required />
      </label>
      <div id="login-err" class="hidden" role="alert" style="font: 600 13px Manrope, sans-serif; color: #a2342a;">Usuário ou senha incorretos.</div>
      <button type="submit" style="height: 52px; border: 0; border-radius: 999px; background: #1b1814; color: #f4f1eb; font: 700 12.5px Manrope, sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;">Entrar</button>
      <button type="button" onclick="window.location.href='index.html'" style="align-self: flex-start; background: transparent; border: 0; padding: 0; font: 600 12px Manrope, sans-serif; color: #6b6358; cursor: pointer;">← Voltar ao catálogo</button>
    </form>
  </div>

  <!-- PAINEL ADMINISTRATIVO -->
  <div id="view-admin" class="admin-body hidden">
    <header style="background: #0c0b0a; color: #f3ede3; position: sticky; top: 0; z-index: 20;">
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 clamp(12px, 3vw, 32px); min-height: 60px; flex-wrap: wrap; max-width: 1280px; margin: 0 auto;">
        <img src="logo-reveluxo.png" alt="Reveluxo" style="height: 34px;" onerror="this.src='https://via.placeholder.com/120x34?text=Reveluxo'" />
        <nav style="display: flex; gap: 4px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none;">
          <button id="tab-btn-dashboard" class="nav-tab-btn active" onclick="switchTab('dashboard')">Painel</button>
          <button id="tab-btn-products" class="nav-tab-btn" onclick="switchTab('products')">Peças</button>
          <button id="tab-btn-categories" class="nav-tab-btn" onclick="switchTab('categories')">Categorias</button>
          <button id="tab-btn-settings" class="nav-tab-btn" onclick="switchTab('settings')">Configurações</button>
        </nav>
        <div style="display: flex; gap: 6px; align-items: center; margin-left: auto;">
          <button onclick="window.location.href='index.html'" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(243,237,227,.25); background: transparent; color: #f3ede3; font: 600 13px Manrope, sans-serif; cursor: pointer;">Ver catálogo</button>
          <button onclick="handleLogout()" style="height: 40px; padding: 0 14px; border: 0; background: transparent; color: #a79e90; font: 600 13px Manrope, sans-serif; cursor: pointer;">Sair</button>
        </div>
      </div>
    </header>

    <main style="max-width: 1280px; margin: 0 auto; padding: 32px clamp(14px, 3vw, 32px) 96px;">
      
      <!-- TAB DASHBOARD -->
      <section id="sec-dashboard" style="display: flex; flex-direction: column; gap: 28px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;">
          <div>
            <div style="font: 700 11px Manrope, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #8a6a2c;">Painel</div>
            <h1 style="margin: 6px 0 0; font: 600 44px/1.05 'Cormorant Garamond', serif;">Olá, Administradora</h1>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="openEditor()" style="height: 52px; padding: 0 26px; border: 0; border-radius: 999px; background: #1b1814; color: #f4f1eb; font: 700 12.5px Manrope, sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;">+ Nova peça</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">
          <div style="text-align: left; background: #fff; border: 1px solid #e6e0d5; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 8px;">
            <span style="font: 600 12px Manrope, sans-serif; color: #6b6358;">Total de Peças</span>
            <span id="dash-total-prods" style="font: 600 44px/1 'Cormorant Garamond', serif; color: #1b1814;">0</span>
          </div>
          <div style="text-align: left; background: #fff; border: 1px solid #e6e0d5; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 8px;">
            <span style="font: 600 12px Manrope, sans-serif; color: #6b6358;">Categorias</span>
            <span id="dash-total-cats" style="font: 600 44px/1 'Cormorant Garamond', serif; color: #1b1814;">0</span>
          </div>
        </div>
      </section>

      <!-- TAB PRODUTOS (LISTA) -->
      <section id="sec-products" class="hidden" style="display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;">
          <h1 style="margin: 0; font: 600 44px/1.05 'Cormorant Garamond', serif;">Peças do Catálogo</h1>
          <button onclick="openEditor()" style="height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #1b1814; color: #f4f1eb; font: 700 12px Manrope, sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;">+ Nova peça</button>
        </div>

        <div id="products-list-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </section>

      <!-- TAB EDITOR DE PRODUTO -->
      <section id="sec-editor" class="hidden" style="display: flex; flex-direction: column; gap: 22px; max-width: 880px; margin: 0 auto;">
        <div>
          <button onclick="switchTab('products')" style="height: 36px; border: 0; background: transparent; padding: 0; color: #6b6358; font: 600 13px Manrope, sans-serif; cursor: pointer;">← Voltar para Peças</button>
          <h1 id="editor-title" style="margin: 4px 0 0; font: 600 44px/1.05 'Cormorant Garamond', serif;">Nova peça</h1>
        </div>

        <form onsubmit="saveProduct(event)" style="display: flex; flex-direction: column; gap: 20px;">
          <input type="hidden" id="edit-prod-id" />

          <section style="background: #fff; border: 1px solid #e6e0d5; border-radius: 20px; padding: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
            <h2 style="margin: 0; grid-column: 1 / -1; font: 700 12px Manrope, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #8a6a2c;">Informações da Peça</h2>
            <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c; grid-column: 1 / -1;">Nome da peça *
              <input type="text" id="edit-prod-name" style="height: 46px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" required />
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c;">Categoria *
              <select id="edit-prod-cat" style="height: 46px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 12px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" required></select>
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c;">Preço (R$) *
              <input type="text" id="edit-prod-price" placeholder="189,90" style="height: 46px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" required />
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c; grid-column: 1 / -1;">URL da Imagem / Foto *
              <input type="url" id="edit-prod-img" placeholder="https://..." style="height: 46px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" required />
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c; grid-column: 1 / -1;">Descrição
              <textarea id="edit-prod-desc" rows="4" style="border: 1px solid #ddd6ca; border-radius: 12px; padding: 12px 14px; font: 500 15px/1.5 Manrope, sans-serif; background: #fff; color: #1b1814; resize: vertical;"></textarea>
            </label>
          </section>

          <div style="display: flex; gap: 10px;">
            <button type="submit" style="height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: #1b1814; color: #f4f1eb; font: 700 12.5px Manrope, sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;">Salvar Peça</button>
            <button type="button" onclick="switchTab('products')" style="height: 50px; padding: 0 18px; border: 0; background: transparent; color: #6b6358; font: 600 13px Manrope, sans-serif; cursor: pointer;">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- TAB CATEGORIAS -->
      <section id="sec-categories" class="hidden" style="display: flex; flex-direction: column; gap: 20px; max-width: 820px;">
        <h1 style="margin: 0; font: 600 44px/1.05 'Cormorant Garamond', serif;">Categorias</h1>
        <form onsubmit="addCategory(event)" style="display: flex; gap: 10px; flex-wrap: wrap;">
          <input type="text" id="new-cat-name" placeholder="Nova categoria, ex.: Moda Fitness" style="flex: 1 1 240px; height: 48px; border: 1px solid #ddd6ca; border-radius: 999px; padding: 0 18px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" required />
          <button type="submit" style="height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: #1b1814; color: #f4f1eb; font: 700 12px Manrope, sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;">Adicionar</button>
        </form>
        <div id="categories-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </section>

      <!-- TAB CONFIGURAÇÕES E FIREBASE -->
      <section id="sec-settings" class="hidden" style="display: flex; flex-direction: column; gap: 20px; max-width: 880px;">
        <h1 style="margin: 0; font: 600 44px/1.05 'Cormorant Garamond', serif;">Sincronização Firebase</h1>
        <section style="background: #fff; border: 1px solid #e6e0d5; border-radius: 20px; padding: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; align-items: end;">
          <h2 style="margin: 0; grid-column: 1 / -1; font: 700 12px Manrope, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #8a6a2c;">Banco de Dados (Firebase)</h2>
          <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c;">Firebase Project ID
            <input type="text" id="fb-project-id" value="reveluxo" style="height: 46px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" />
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c;">Firebase API Key
            <input type="text" id="fb-api-key" value="AIzaSyDWSw_gtqBjONiqw3pCCLZ" style="height: 46px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" />
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font: 600 12px Manrope, sans-serif; color: #4a443c;">Coleção
            <input type="text" id="fb-collection" value="catalogo" style="height: 46px; border: 1px solid #ddd6ca; border-radius: 12px; padding: 0 14px; font: 500 15px Manrope, sans-serif; background: #fff; color: #1b1814;" />
          </label>
          <div style="grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <button onclick="fbPush()" style="height: 46px; padding: 0 20px; border: 0; border-radius: 999px; background: #1b1814; color: #f4f1eb; font: 700 12px Manrope, sans-serif; cursor: pointer;">Enviar ao Firebase</button>
            <button onclick="fbPull()" style="height: 46px; padding: 0 20px; border: 1px solid #1b1814; border-radius: 999px; background: #fff; color: #1b1814; font: 700 12px Manrope, sans-serif; cursor: pointer;">Baixar do Firebase</button>
            <span id="fb-status" style="font: 600 12.5px Manrope, sans-serif; color: #6b6358;"></span>
          </div>
        </section>
      </section>

    </main>
  </div>

  <div id="toast" class="toast-msg hidden"></div>

  <script>
    const STORAGE_KEY = 'catalogo_roupas_v6';

    const DEFAULT_CATS = [
      { id: 'c1', name: 'Vestidos' },
      { id: 'c2', name: 'Blusas' },
      { id: 'c3', name: 'Calças' },
      { id: 'c4', name: 'Casacos' }
    ];

    let state = {
      prods: [],
      cats: DEFAULT_CATS,
      me: null
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      checkAuth();
    });

    function loadState() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          state.prods = parsed.prods || [];
          state.cats = parsed.cats && parsed.cats.length ? parsed.cats : DEFAULT_CATS;
        } catch (e) { console.error(e); }
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ prods: state.prods, cats: state.cats }));
      renderAll();
    }

    function showToast(msg, isErr = false) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = `toast-msg ${isErr ? 'error' : ''}`;
      setTimeout(() => t.classList.add('hidden'), 3000);
    }

    function checkAuth() {
      const logged = sessionStorage.getItem('rvx_me');
      if (logged) {
        state.me = logged;
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-admin').classList.remove('hidden');
        renderAll();
      } else {
        document.getElementById('view-login').classList.remove('hidden');
        document.getElementById('view-admin').classList.add('hidden');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value;

      if (u.toLowerCase() === 'admin' && p === 'capivara2026') {
        sessionStorage.setItem('rvx_me', 'admin');
        document.getElementById('login-err').classList.add('hidden');
        checkAuth();
      } else {
        document.getElementById('login-err').classList.remove('hidden');
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('rvx_me');
      checkAuth();
    }

    function switchTab(tab) {
      ['dashboard', 'products', 'editor', 'categories', 'settings'].forEach(t => {
        const sec = document.getElementById(`sec-${t}`);
        if (sec) sec.classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        if (btn) btn.classList.remove('active');
      });

      const activeSec = document.getElementById(`sec-${tab}`);
      if (activeSec) activeSec.classList.remove('hidden');

      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function renderAll() {
      // Dashboard Total
      document.getElementById('dash-total-prods').innerText = state.prods.length;
      document.getElementById('dash-total-cats').innerText = state.cats.length;

      // Render Lista de Produtos
      const prodContainer = document.getElementById('products-list-container');
      prodContainer.innerHTML = '';

      if (state.prods.length === 0) {
        prodContainer.innerHTML = `<div style="padding: 20px; background: #fff; border-radius: 12px;">Nenhum produto cadastrado.</div>`;
      } else {
        state.prods.forEach(p => {
          const cat = state.cats.find(c => c.id === p.cat);
          const imgUrl = p.img || (p.images && p.images[0] ? p.images[0].url : 'https://via.placeholder.com/80?text=Sem+Foto');
          
          const row = document.createElement('div');
          row.style = "display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e6e0d5; border-radius: 16px; padding: 12px 14px;";
          row.innerHTML = `
            <img src="${imgUrl}" style="width: 52px; height: 66px; object-fit: cover; border-radius: 8px;" onerror="this.src='https://via.placeholder.com/80?text=Sem+Foto'" />
            <div style="flex: 1; display: flex; flex-direction: column;">
              <span style="font: 700 15px Manrope, sans-serif;">${p.name}</span>
              <span style="font: 500 12.5px Manrope, sans-serif; color: #6b6358;">${cat ? cat.name : 'Geral'} · R$ ${p.price}</span>
            </div>
            <button onclick="openEditor('${p.id}')" style="height: 38px; padding: 0 12px; border: 1px solid #ddd6ca; border-radius: 999px; background: #fff; cursor: pointer;">Editar</button>
            <button onclick="deleteProduct('${p.id}')" style="height: 38px; padding: 0 12px; border: 1px solid #efd3cf; border-radius: 999px; background: #fff; color: #a2342a; cursor: pointer;">Excluir</button>
          `;
          prodContainer.appendChild(row);
        });
      }

      // Render Categorias
      const catSelect = document.getElementById('edit-prod-cat');
      catSelect.innerHTML = '';
      const catListContainer = document.getElementById('categories-list');
      catListContainer.innerHTML = '';

      state.cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.innerText = c.name;
        catSelect.appendChild(opt);

        const crow = document.createElement('div');
        crow.style = "display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e6e0d5; border-radius: 16px; padding: 12px 18px;";
        crow.innerHTML = `
          <span style="font: 700 15px Manrope, sans-serif;">${c.name}</span>
          <button onclick="deleteCategory('${c.id}')" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #efd3cf; background: #fff; color: #a2342a; cursor: pointer;">Excluir</button>
        `;
        catListContainer.appendChild(crow);
      });
    }

    function openEditor(id = null) {
      switchTab('editor');
      if (id) {
        const p = state.prods.find(x => x.id === id);
        if (p) {
          document.getElementById('editor-title').innerText = 'Editar Peça';
          document.getElementById('edit-prod-id').value = p.id;
          document.getElementById('edit-prod-name').value = p.name;
          document.getElementById('edit-prod-cat').value = p.cat;
          document.getElementById('edit-prod-price').value = p.price;
          document.getElementById('edit-prod-img').value = p.img || (p.images && p.images[0] ? p.images[0].url : '');
          document.getElementById('edit-prod-desc').value = p.desc || '';
        }
      } else {
        document.getElementById('editor-title').innerText = 'Nova Peça';
        document.getElementById('edit-prod-id').value = '';
        document.getElementById('edit-prod-name').value = '';
        document.getElementById('edit-prod-price').value = '';
        document.getElementById('edit-prod-img').value = '';
        document.getElementById('edit-prod-desc').value = '';
      }
    }

    function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('edit-prod-id').value || 'p' + Date.now();
      const name = document.getElementById('edit-prod-name').value;
      const cat = document.getElementById('edit-prod-cat').value;
      const price = document.getElementById('edit-prod-price').value;
      const img = document.getElementById('edit-prod-img').value;
      const desc = document.getElementById('edit-prod-desc').value;

      const newProd = { id, name, cat, price, img, desc };
      const idx = state.prods.findIndex(p => p.id === id);

      if (idx >= 0) {
        state.prods[idx] = newProd;
      } else {
        state.prods.unshift(newProd);
      }

      saveState();
      fbPush();
      showToast('Peça salva com sucesso!');
      switchTab('products');
    }

    function deleteProduct(id) {
      if (confirm("Deseja realmente excluir esta peça?")) {
        state.prods = state.prods.filter(p => p.id !== id);
        saveState();
        fbPush();
        showToast('Peça excluída.');
      }
    }

    function addCategory(e) {
      e.preventDefault();
      const input = document.getElementById('new-cat-name');
      const name = input.value.trim();
      if (name) {
        state.cats.push({ id: 'c' + Date.now(), name });
        input.value = '';
        saveState();
        fbPush();
        showToast('Categoria adicionada!');
      }
    }

    function deleteCategory(id) {
      if (confirm("Excluir esta categoria?")) {
        state.cats = state.cats.filter(c => c.id !== id);
        saveState();
        fbPush();
        showToast('Categoria removida.');
      }
    }

    async function fbPush() {
      const proj = document.getElementById('fb-project-id').value.trim();
      const key = document.getElementById('fb-api-key').value.trim();
      const col = document.getElementById('fb-collection').value.trim();
      const status = document.getElementById('fb-status');

      status.innerText = "Enviando...";

      const endpoint = `https://firestore.googleapis.com/v1/projects/${proj}/databases/(default)/documents/${col}/loja?key=${key}`;
      const payload = {
        fields: {
          data: { stringValue: JSON.stringify({ cats: state.cats, prods: state.prods }) }
        }
      };

      try {
        const res = await fetch(endpoint, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          status.innerText = "Enviado com sucesso!";
        } else {
          status.innerText = "Erro ao enviar ao Firebase.";
        }
      } catch (err) {
        status.innerText = "Falha de conexão.";
      }
    }

    async function fbPull() {
      const proj = document.getElementById('fb-project-id').value.trim();
      const key = document.getElementById('fb-api-key').value.trim();
      const col = document.getElementById('fb-collection').value.trim();
      const status = document.getElementById('fb-status');

      status.innerText = "Baixando...";

      const endpoint = `https://firestore.googleapis.com/v1/projects/${proj}/databases/(default)/documents/${col}/loja?key=${key}`;

      try {
        const res = await fetch(endpoint);
        const doc = await res.json();
        if (doc && doc.fields && doc.fields.data && doc.fields.data.stringValue) {
          const data = JSON.parse(doc.fields.data.stringValue);
          state.prods = data.prods || [];
          state.cats = data.cats || state.cats;
          saveState();
          status.innerText = "Catálogo atualizado!";
        } else {
          status.innerText = "Nenhum dado encontrado.";
        }
      } catch (err) {
        status.innerText = "Erro ao baixar dados.";
      }
    }
  </script>
</body>
</html>
