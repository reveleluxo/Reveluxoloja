<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Administração — Reveluxo</title>
  <link rel="icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0a; color: #eae5da; font-family: 'Jost', sans-serif; font-weight: 300; }
    * { box-sizing: border-box; }
    a { color: #c9a44c; text-decoration: none; }
    input, textarea, select, button { font-family: inherit; color: inherit; }
    
    .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    .card { background: #141414; border: 1px solid #23211c; border-radius: 16px; padding: 24px; margin-bottom: 28px; }
    .title { font-size: 20px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #c9a44c; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    
    label { display: block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #a49c8c; margin-bottom: 6px; }
    input[type="text"], input[type="number"], textarea, select { width: 100%; background: #000; border: 1px solid #2e2b24; border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; margin-bottom: 16px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #c9a44c; }

    .btn { background: #c9a44c; color: #000; border: none; padding: 14px 24px; border-radius: 9999px; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; width: 100%; }
    .btn:hover { background: #e3c684; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: #3a1515; color: #ff6b6b; border: 1px solid #5a2020; }
    .btn-danger:hover { background: #5a2020; color: #fff; }

    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .preview-item { position: relative; width: 90px; height: 120px; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .remove-photo-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.8); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .item-row { display: flex; align-items: center; justify-content: space-between; background: #000; border: 1px solid #222; padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; gap: 12px; }
    .item-info { display: flex; align-items: center; gap: 14px; }
    .item-thumb { width: 44px; height: 58px; border-radius: 6px; object-fit: cover; background: #222; }

    .status-badge { font-size: 11px; padding: 6px 12px; border-radius: 20px; background: #1f271b; color: #7ec870; border: 1px solid #2e4428; display: inline-block; margin-bottom: 16px; }
    .status-badge.error { background: #3a1515; color: #ff6b6b; border-color: #5a2020; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h1 style="font-size: 18px; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; margin: 0;">Painel Reveluxo</h1>
      <a href="index.html" style="font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;">← Voltar ao Site</a>
    </div>

    <div id="status-msg" class="status-badge hidden">Conectado ao Firebase</div>

    <!-- Formulário de Peça -->
    <div class="card">
      <div class="title" id="form-title">Cadastrar Nova Peça</div>
      
      <form id="prod-form" onsubmit="handleSaveProduct(event)">
        <input type="hidden" id="prod-id" />

        <label for="prod-name">Nome da Peça</label>
        <input type="text" id="prod-name" required placeholder="Ex: Vestido Seda Dourado" />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <label for="prod-price">Preço (R$)</label>
            <input type="text" id="prod-price" required placeholder="Ex: 189,90" />
          </div>
          <div>
            <label for="prod-cat">Categoria</label>
            <select id="prod-cat" required></select>
          </div>
        </div>

        <label for="prod-desc">Descrição</label>
        <textarea id="prod-desc" rows="3" placeholder="Detalhes do tecido, caimento, tamanhos..."></textarea>

        <label>Fotos da Peça (Você pode selecionar várias)</label>
        <input type="file" id="prod-files" accept="image/*" multiple onchange="handleFileSelect(event)" style="display: none;" />
        
        <div style="margin-bottom: 16px;">
          <button type="button" onclick="document.getElementById('prod-files').click()" style="background: #222; border: 1px dashed #444; width: 100%; padding: 16px; border-radius: 8px; color: #ccc; cursor: pointer; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;">
            📷 Adicionar Fotos da Galeria / Câmera
          </button>
        </div>

        <div id="photos-preview" class="preview-grid"></div>

        <button type="submit" id="btn-save" class="btn">Salvar Peça no Site</button>
        <button type="button" id="btn-cancel" onclick="resetForm()" class="btn btn-danger hidden" style="margin-top: 10px;">Cancelar Edição</button>
      </form>
    </div>

    <!-- Lista de Peças -->
    <div class="card">
      <div class="title">
        <span>Peças Cadastradas</span>
        <span id="prod-count" style="font-size: 12px; color: #888;">0 Peças</span>
      </div>
      <div id="prods-list"></div>
    </div>
  </div>

  <script>
    const FIREBASE_CONFIG = {
      fbProjectId: 'reveluxo',
      fbApiKey: 'AIzaSyDWSw_gtqBjONiqw3pCCLZf5LWmrLeSS90',
      fbCollection: 'catalogo'
    };

    const STORAGE_KEY = 'catalogo_roupas_v6';

    const DEFAULT_CATS = [
      { id: 'c1', name: 'Vestidos' },
      { id: 'c2', name: 'Blusas' },
      { id: 'c3', name: 'Calças' },
      { id: 'c4', name: 'Casacos' }
    ];

    let state = {
      prods: [],
      cats: DEFAULT_CATS
    };

    let currentImages = [];

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalStorage();
      fetchFirebaseData();
    });

    function loadLocalStorage() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          state.prods = parsed.prods || [];
          state.cats = parsed.cats && parsed.cats.length ? parsed.cats : DEFAULT_CATS;
        } catch (e) { console.error(e); }
      }
      renderCategoriesSelect();
      renderProductsList();
    }

    async function fetchFirebaseData() {
      const proj = FIREBASE_CONFIG.fbProjectId;
      const key = FIREBASE_CONFIG.fbApiKey;
      const col = FIREBASE_CONFIG.fbCollection;

      const endpoint = `https://firestore.googleapis.com/v1/projects/${proj}/databases/(default)/documents/${col}?key=${key}&t=${Date.now()}`;

      try {
        const response = await fetch(endpoint);
        const doc = await response.json();
        
        if (doc && doc.documents) {
          const prodsMap = new Map();

          doc.documents.forEach(d => {
            const docName = d.name.split('/').pop();
            if (d.fields && d.fields.data && d.fields.data.stringValue) {
              try {
                const parsed = JSON.parse(d.fields.data.stringValue);
                if (docName === '_categorias') {
                  state.cats = parsed;
                } else if (docName === 'loja') {
                  if (Array.isArray(parsed.prods)) {
                    parsed.prods.forEach(p => { if (p && p.id) prodsMap.set(p.id, p); });
                  }
                } else {
                  if (parsed && parsed.id) prodsMap.set(parsed.id, parsed);
                }
              } catch(e) {}
            }
          });
          
          state.prods = Array.from(prodsMap.values());
          saveAndSyncLocal();
          renderCategoriesSelect();
          renderProductsList();
          showStatus("Sincronizado com o Firebase");
        }
      } catch (err) {
        console.log("Erro ao carregar do Firebase:", err);
      }
    }

    function saveAndSyncLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ prods: state.prods, cats: state.cats }));
    }

    function showStatus(text, isError = false) {
      const badge = document.getElementById('status-msg');
      badge.innerText = text;
      if (isError) {
        badge.classList.add('error');
      } else {
        badge.classList.remove('error');
      }
      badge.classList.remove('hidden');
      setTimeout(() => badge.classList.add('hidden'), 4000);
    }

    function renderCategoriesSelect() {
      const select = document.getElementById('prod-cat');
      select.innerHTML = '';
      state.cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.innerText = c.name;
        select.appendChild(opt);
      });
    }

    function renderProductsList() {
      const container = document.getElementById('prods-list');
      document.getElementById('prod-count').innerText = `${state.prods.length} ${state.prods.length === 1 ? 'Peça' : 'Peças'}`;
      container.innerHTML = '';

      if (state.prods.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px; font-size: 13px;">Nenhuma peça cadastrada.</div>';
        return;
      }

      state.prods.forEach(p => {
        const cat = state.cats.find(c => c.id === p.cat);
        const imgUrl = p.img || (p.images && p.images[0] ? (p.images[0].url || p.images[0]) : 'https://via.placeholder.com/100?text=Sem+Foto');

        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-info">
            <img src="${imgUrl}" class="item-thumb" onerror="this.src='https://via.placeholder.com/100?text=Erro'" />
            <div>
              <div style="font-weight: 500; font-size: 15px; color: #fff;">${p.name}</div>
              <div style="font-size: 12px; color: #c9a44c;">R$ ${p.price} · <span style="color: #888;">${cat ? cat.name : 'Geral'}</span></div>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button onclick="editProduct('${p.id}')" style="background: #222; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px;">Editar</button>
            <button onclick="deleteProduct('${p.id}')" style="background: #3a1515; border: 1px solid #5a2020; color: #ff6b6b; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px;">Excluir</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Redimensionamento de imagem otimizado para caber no limite do Firestore
    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      let processedCount = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 1066;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
            currentImages.push(compressedBase64);

            processedCount++;
            if (processedCount === files.length) {
              renderPhotosPreview();
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPhotosPreview() {
      const container = document.getElementById('photos-preview');
      container.innerHTML = '';
      currentImages.forEach((url, idx) => {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `
          <img src="${url}" />
          <button type="button" class="remove-photo-btn" onclick="removePhoto(${idx})">✕</button>
        `;
        container.appendChild(item);
      });
    }

    function removePhoto(idx) {
      currentImages.splice(idx, 1);
      renderPhotosPreview();
    }

    async function handleSaveProduct(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.innerText = 'Enviando ao banco de dados...';
      btn.disabled = true;

      const id = document.getElementById('prod-id').value || 'p_' + Date.now();
      const name = document.getElementById('prod-name').value.trim();
      const price = document.getElementById('prod-price').value.trim();
      const cat = document.getElementById('prod-cat').value;
      const desc = document.getElementById('prod-desc').value.trim();

      const prodData = {
        id: id,
        name: name,
        price: price,
        cat: cat,
        desc: desc,
        images: currentImages,
        img: currentImages[0] || 'https://via.placeholder.com/300x400?text=Sem+Foto'
      };

      const success = await saveToFirebase(id, prodData);

      if (success) {
        const existingIdx = state.prods.findIndex(x => x.id === id);
        if (existingIdx >= 0) {
          state.prods[existingIdx] = prodData;
        } else {
          state.prods.push(prodData);
        }

        saveAndSyncLocal();
        renderProductsList();
        resetForm();
        showStatus("Peça salva com sucesso no Firebase!");
      } else {
        showStatus("Erro ao salvar! Tente reduzir a quantidade de fotos da peça.", true);
      }

      btn.innerText = 'Salvar Peça no Site';
      btn.disabled = false;
    }

    async function saveToFirebase(docId, dataObj) {
      const proj = FIREBASE_CONFIG.fbProjectId;
      const key = FIREBASE_CONFIG.fbApiKey;
      const col = FIREBASE_CONFIG.fbCollection;

      const url = `https://firestore.googleapis.com/v1/projects/${proj}/databases/(default)/documents/${col}/${docId}?key=${key}`;

      const payload = {
        fields: {
          data: { stringValue: JSON.stringify(dataObj) }
        }
      };

      try {
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch (err) {
        console.error("Erro ao salvar no Firebase:", err);
        return false;
      }
    }

    async function deleteProduct(id) {
      if (!confirm("Tem certeza que deseja excluir esta peça?")) return;

      state.prods = state.prods.filter(x => x.id !== id);
      saveAndSyncLocal();
      renderProductsList();

      const proj = FIREBASE_CONFIG.fbProjectId;
      const key = FIREBASE_CONFIG.fbApiKey;
      const col = FIREBASE_CONFIG.fbCollection;

      const url = `https://firestore.googleapis.com/v1/projects/${proj}/databases/(default)/documents/${col}/${id}?key=${key}`;

      try {
        await fetch(url, { method: 'DELETE' });
        showStatus("Peça excluída com sucesso!");
      } catch (err) {
        console.error("Erro ao excluir do Firebase:", err);
      }
    }

    function editProduct(id) {
      const prod = state.prods.find(x => x.id === id);
      if (!prod) return;

      document.getElementById('prod-id').value = prod.id;
      document.getElementById('prod-name').value = prod.name;
      document.getElementById('prod-price').value = prod.price;
      document.getElementById('prod-cat').value = prod.cat;
      document.getElementById('prod-desc').value = prod.desc || '';

      if (prod.images && prod.images.length > 0) {
        currentImages = prod.images.map(i => typeof i === 'string' ? i : (i.url || i));
      } else if (prod.img) {
        currentImages = [prod.img];
      } else {
        currentImages = [];
      }

      renderPhotosPreview();

      document.getElementById('form-title').innerText = 'Editar Peça';
      document.getElementById('btn-save').innerText = 'Atualizar Peça';
      document.getElementById('btn-cancel').classList.remove('hidden');

      window.scrollTo(0, 0);
    }

    function resetForm() {
      document.getElementById('prod-form').reset();
      document.getElementById('prod-id').value = '';
      currentImages = [];
      renderPhotosPreview();

      document.getElementById('form-title').innerText = 'Cadastrar Nova Peça';
      document.getElementById('btn-save').innerText = 'Salvar Peça no Site';
      document.getElementById('btn-cancel').classList.add('hidden');
    }
  </script>
</body>
</html>
